<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#164c50"><title>The Beauty Ledger</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#193739;background:#f6f8f6}*{box-sizing:border-box}body{margin:0}.app{max-width:780px;margin:auto;padding:18px 16px 90px}header{display:flex;align-items:center;justify-content:space-between;margin:8px 0 20px}h1{font-family:Georgia,serif;font-size:29px;margin:4px 0}h2{font-size:19px;margin:5px 0 14px}h3{font-size:16px;margin:0 0 12px}.eyebrow{font-size:10px;letter-spacing:2.3px;font-weight:800;color:#36777a}.sub,.muted{color:#6a7e7c;font-size:13px}.logo{font-size:27px;background:#e3efec;padding:12px;border-radius:16px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#e8eeeb;border-radius:13px;padding:5px;margin-bottom:18px}.tab{border:0;background:transparent;padding:11px 3px;font-size:12px;color:#56716d;border-radius:9px}.tab.active{background:white;color:#164c50;font-weight:800;box-shadow:0 1px 4px #0001}.panel{background:white;border:1px solid #e0e9e5;border-radius:17px;padding:17px;margin:12px 0;box-shadow:0 3px 14px #173d3c08}.soft{background:#eaf2ef;border:0}.field{display:block;margin:12px 0;font-size:12px;font-weight:700;color:#44605d}.field input,.field select,textarea{display:block;margin-top:6px;width:100%;border:1px solid #d5e1dc;border-radius:10px;background:white;color:#173c3a;padding:12px;font-size:16px;min-height:44px}textarea{min-height:70px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.row>*{min-width:0}.button{border:0;background:#164c50;color:white;border-radius:11px;padding:13px 16px;font-size:14px;font-weight:750;cursor:pointer}.button.secondary{background:#e6efeb;color:#164c50}.button.outline{border:1px solid #bbd0c9;background:white;color:#164c50}.button.small{padding:8px 10px;font-size:12px}.button.danger{background:#fff0ef;color:#9a3a36}.button:disabled{opacity:.5}.full{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1}.bowlhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.item{background:#f3f7f5;padding:11px;border-radius:12px;margin:9px 0}.itemgrid{display:grid;grid-template-columns:1fr 110px;gap:9px}.price{font-size:26px;font-weight:800;letter-spacing:-1px}.metric{font-size:30px;font-weight:850}.line{display:flex;justify-content:space-between;gap:15px;padding:8px 0;border-bottom:1px solid #edf1ef;font-size:14px}.line:last-child{border-bottom:0}.note{font-size:12px;color:#71817c;line-height:1.5}.pill{display:inline-block;border-radius:99px;padding:4px 8px;background:#e7f0ed;font-size:11px;color:#285b58}.hidden{display:none!important}.empty{text-align:center;padding:24px;color:#687f78}.footer{font-size:11px;color:#768781;text-align:center;margin:24px 0}.warn{background:#fff6e7;padding:12px;border-radius:10px;font-size:12px;color:#77551b}details summary{cursor:pointer;font-weight:700}.tiny{font-size:11px}.spacer{height:10px}@media(max-width:400px){.app{padding:12px 10px 60px}.tab{font-size:11px}.grid2{gap:7px}}
</style></head><body><div class="app"><header><div><div class="eyebrow">THE BEAUTY LEDGER</div><h1>Color Studio</h1><div class="sub">Your formula. Your actual cost.</div></div><div class="logo">⚗</div></header><nav class="tabs" id="tabs"></nav><main id="view"></main><div class="footer">Local-first prototype · Export backups regularly · No booking or appointment tracking</div></div><script>
'use strict';
const KEY='beautyledger-v1';const defaults={products:[
{id:'blondor',name:'Wella BlondorPlex',cost:45,size:28.2,unit:'weight oz'},
{id:'dev10',name:'10 Vol Developer',cost:5.49,size:32,unit:'fl oz'},
{id:'dev20',name:'20 Vol Developer',cost:5.49,size:32,unit:'fl oz'},
{id:'dev30',name:'30 Vol Developer',cost:5.49,size:32,unit:'fl oz'},
{id:'joicodemi',name:'Joico LumiShine Demi Liquid',cost:9.65,size:2,unit:'fl oz'},
{id:'joicoperm',name:'Joico LumiShine Permanent',cost:9.65,size:2.5,unit:'weight oz'},
{id:'pm10',name:'Paul Mitchell 10 Vol Liquid',cost:6.35,size:33.8,unit:'fl oz'},
{id:'shades',name:'Redken Shades EQ Gloss',cost:7.95,size:2,unit:'fl oz'},
{id:'shadesdev',name:'Shades EQ Processing Solution',cost:8.99,size:33.8,unit:'fl oz'},
{id:'foilclub',name:'Product Club Foil Sheet',cost:16.76,size:500,unit:'sheet'},
{id:'foilframar',name:'Framar Foil Sheet',cost:23.99,size:500,unit:'sheet'}],
formulas:[],settings:{boothWeekly:125,subscription:25,otherMonthly:0,monthlyHours:104,processingPct:2.5,supplyAllowance:5,monthlyGoal:5000},services:[{name:'Partial Blonding',price:125,minutes:165},{name:'Full Blonding',price:175,minutes:165},{name:'Face Frame Blonding',price:85,minutes:90},{name:'Root Touch-Up',price:85,minutes:90},{name:'Gloss & Tone',price:75,minutes:60},{name:'Dimensional Brunette',price:175,minutes:180},{name:'Custom Service',price:0,minutes:60}]};
function clone(x){return JSON.parse(JSON.stringify(x))}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.products)&&Array.isArray(x.formulas)&&x.settings)return x}catch(e){}return clone(defaults)}let db=load();let tab='mix';let editId=null;let current={client:'',service:'Partial Blonding',price:125,minutes:165,supplies:5,notes:'',bowls:[{id:'b1',name:'Lightener',items:[{id:'i1',product:'blondor',amount:1,unused:0},{id:'i2',product:'dev20',amount:2,unused:0}]},{id:'b2',name:'Toner',items:[{id:'i3',product:'joicodemi',amount:1,unused:0},{id:'i4',product:'pm10',amount:1,unused:0}]}]};
function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(x){return '$'+(Number(x)||0).toFixed(2)}function num(x){return Math.max(0,Number(x)||0)}function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Could not save locally. Export your data and check browser storage.');return false}}
function product(id){return db.products.find(p=>p.id===id)}function itemCost(i){let p=product(i.product);return p&&num(p.size)>0?num(i.amount)*num(p.cost)/num(p.size):0}function chemical(f){return f.bowls.reduce((s,b)=>s+b.items.reduce((t,i)=>t+itemCost(i),0),0)}function wasteCost(f){return f.bowls.reduce((s,b)=>s+b.items.reduce((t,i)=>t+itemCost(i)*Math.min(100,num(i.unused))/100,0),0)}function overhead(f){let s=db.settings;return (num(s.boothWeekly)*52/12+num(s.subscription)+num(s.otherMonthly))/Math.max(1,num(s.monthlyHours))*num(f.minutes)/60}function fees(f){return num(f.price)*num(db.settings.processingPct)/100}function profit(f){return num(f.price)-chemical(f)-num(f.supplies)-overhead(f)-fees(f)}
function field(label,id,value,type='text',extra=''){return `<label class="field">${esc(label)}<input id="${esc(id)}" type="${type}" value="${esc(value)}" ${extra}></label>`}function btn(text,fn,cls=''){return `<button class="button ${cls}" onclick="${fn}">${text}</button>`}function options(arr,selected){return arr.map(x=>`<option value="${esc(x.value)}" ${x.value===selected?'selected':''}>${esc(x.label)}</option>`).join('')}
function nav(){document.getElementById('tabs').innerHTML=[['mix','Mix'],['profit','Profit'],['history','History'],['products','Products'],['settings','Settings']].map(([k,v])=>`<button class="tab ${tab===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('')}
function go(t){tab=t;render();window.scrollTo(0,0)}function render(){nav();let v=document.getElementById('view');v.innerHTML=tab==='mix'?renderMix():tab==='profit'?renderProfit():tab==='history'?renderHistory():tab==='products'?renderProducts():renderSettings()}
function renderMix(){let c=chemical(current);return `<div class="panel"><h2>${editId?'Edit saved formula':'New color formula'}</h2>${field('Client name','client',current.client)}<label class="field">Service<select id="service" onchange="setService(this.value)">${options(db.services.map(s=>({value:s.name,label:s.name})),current.service)}</select></label><label class="field">Formula notes<textarea id="notes" oninput="current.notes=this.value">${esc(current.notes)}</textarea></label></div>${current.bowls.map((b,n)=>`<section class="panel"><div class="bowlhead"><h3>Bowl ${n+1} <span class="pill">${money(b.items.reduce((s,i)=>s+itemCost(i),0))}</span></h3>${btn('Remove',`removeBowl('${b.id}')`,'small danger')}</div>${field('Bowl label','label-'+b.id,b.name)}${b.items.map(i=>`<div class="item"><div class="row"><b class="tiny">PRODUCT</b>${btn('✕',`removeItem('${b.id}','${i.id}')`,'small danger')}</div><label class="field">Product<select onchange="changeItem('${b.id}','${i.id}','product',this.value)">${options(db.products.map(p=>({value:p.id,label:p.name+' ('+p.unit+')'})),i.product)}</select></label><div class="itemgrid">${field('Amount ('+esc(product(i.product)?.unit||'?')+')','amt-'+i.id,i.amount,'number','min="0" step="any" oninput="changeItem(\''+b.id+'\',\''+i.id+'\',\'amount\',this.value)"')}${field('Unused mix %','unused-'+i.id,i.unused,'number','min="0" max="100" step="any" oninput="changeItem(\''+b.id+'\',\''+i.id+'\',\'unused\',this.value)"')}</div><div class="row"><span class="muted">Ingredient cost</span><b>${money(itemCost(i))}</b></div></div>`).join('')}${btn('+ Add product',`addItem('${b.id}')`,'secondary full')}</section>`).join('')}<div class="actions">${btn('+ Add bowl / remix','addBowl()','outline')}${btn('Clear form','clearForm()','secondary')}</div><section class="panel soft"><div class="row"><b>Chemical cost</b><span class="price">${money(c)}</span></div><div class="line"><span>Bowls</span><b>${current.bowls.length}</b></div><div class="line"><span>Unused mix value (included above)</span><b>${money(wasteCost(current))}</b></div></section><div class="actions">${btn('See profit →','syncAndProfit()')}${btn(editId?'Update formula':'Save formula','saveFormula()','secondary')}</div><p class="note">Use weight oz for weighed powders and weight-priced color; fl oz for volume-priced liquids. Do not enter liquid scale weights as fl oz without a verified conversion.</p>`}
function syncTop(){let a=document.getElementById('client'),n=document.getElementById('notes');if(a)current.client=a.value;if(n)current.notes=n.value;current.bowls.forEach(b=>{let e=document.getElementById('label-'+b.id);if(e)b.name=e.value})}function setService(v){syncTop();current.service=v;let s=db.services.find(x=>x.name===v);if(s){current.price=s.price;current.minutes=s.minutes}render()}function changeItem(bid,iid,key,value){let i=current.bowls.find(b=>b.id===bid)?.items.find(i=>i.id===iid);if(!i)return;i[key]=key==='product'?value:num(value);syncTop();let focus=document.activeElement;let activeId=focus?.id;let start=focus?.selectionStart;render();let el=activeId&&document.getElementById(activeId);if(el){el.focus();if(start!=null&&el.setSelectionRange)try{el.setSelectionRange(start,start)}catch(e){}}}function addBowl(){syncTop();current.bowls.push({id:uid(),name:'Extra mix',items:[]});render()}function removeBowl(id){if(current.bowls.length===1){alert('Keep at least one bowl.');return}syncTop();current.bowls=current.bowls.filter(b=>b.id!==id);render()}function addItem(id){syncTop();current.bowls.find(b=>b.id===id).items.push({id:uid(),product:db.products[0]?.id||'',amount:0,unused:0});render()}function removeItem(bid,iid){syncTop();let b=current.bowls.find(b=>b.id===bid);b.items=b.items.filter(i=>i.id!==iid);render()}function clearForm(){if(!confirm('Start a blank formula? Unsaved changes will be lost.'))return;editId=null;current={client:'',service:'Partial Blonding',price:125,minutes:165,supplies:db.settings.supplyAllowance,notes:'',bowls:[{id:uid(),name:'Bowl 1',items:[]}]};render()}function syncAndProfit(){syncTop();go('profit')}
function renderProfit(){return `<section class="panel"><h2>Service profitability</h2><div class="grid2">${field('Service price ($)','price',current.price,'number','min="0" step="any" oninput="updateFinancial()"')}${field('Time (minutes)','minutes',current.minutes,'number','min="1" step="any" oninput="updateFinancial()"')}</div>${field('Other supplies ($)','supplies',current.supplies,'number','min="0" step="any" oninput="updateFinancial()"')}</section><section class="panel soft" id="profitbox">${profitMarkup()}</section><p class="note">Estimated operating earnings before personal taxes. Allocated overhead is based on your entered monthly booked hours; it is not an additional cash charge per service. All mixed product, including leftovers, is already costed.</p><div class="actions">${btn('← Edit bowls',"go('mix')",'outline')}${btn(editId?'Update formula':'Save formula','saveFormula()')}</div>`}function profitMarkup(){return `<div class="eyebrow">ESTIMATED SERVICE EARNINGS</div><div class="metric">${money(profit(current))}</div><div class="sub">${money(profit(current)/(Math.max(1,num(current.minutes))/60))} per booked hour</div><div class="spacer"></div>${[['Service revenue',num(current.price)],['Chemical products',-chemical(current)],['Other supplies',-num(current.supplies)],['Processing fees',-fees(current)],['Allocated overhead',-overhead(current)],['Unused mixed product (already counted)',wasteCost(current)]].map(([a,b],i)=>`<div class="line"><span>${esc(a)}</span><b>${i===5?'Included: ':''}${money(b)}</b></div>`).join('')}`}function updateFinancial(){current.price=num(document.getElementById('price').value);current.minutes=num(document.getElementById('minutes').value);current.supplies=num(document.getElementById('supplies').value);document.getElementById('profitbox').innerHTML=profitMarkup()}
function saveFormula(){if(tab==='mix')syncTop();if(tab==='profit')updateFinancial();if(!current.client.trim()){alert('Enter a client name to save this formula.');go('mix');return}if(!current.bowls.some(b=>b.items.length)){alert('Add at least one product to save.');go('mix');return}let snapshot=clone(current);let record={...snapshot,id:editId||uid(),savedAt:new Date().toISOString(),costAtSave:chemical(current),wasteAtSave:wasteCost(current),profitAtSave:profit(current)};if(editId){let ix=db.formulas.findIndex(x=>x.id===editId);if(ix>=0)db.formulas[ix]=record;else db.formulas.unshift(record)}else db.formulas.unshift(record);if(save()){editId=null;go('history')}}function renderHistory(){let q=historyQuery.toLowerCase();let arr=db.formulas.filter(f=>f.client.toLowerCase().includes(q)||f.service.toLowerCase().includes(q));return `<section class="panel"><h2>Client formula history</h2><label class="field">Find a client or service<input placeholder="Search formulas" value="${esc(historyQuery)}" oninput="historyQuery=this.value;renderHistoryList()"></label><div id="historylist">${historyList(arr)}</div></section>`}let historyQuery='';function historyList(arr){return arr.length?arr.map(f=>`<section class="panel"><div class="row"><div><b>${esc(f.client)}</b><div class="muted">${esc(f.service)} · ${new Date(f.savedAt).toLocaleDateString()} · ${f.bowls.length} bowls</div></div><b>${money(f.costAtSave??0)}</b></div><p class="note">${esc(f.notes||'No notes')}</p><details><summary>View saved formula</summary>${f.bowls.map(b=>`<p class="tiny"><b>${esc(b.name)}:</b> ${b.items.map(i=>`${esc(product(i.product)?.name||'Unknown product')} ${num(i.amount)} ${esc(product(i.product)?.unit||'units')}`).join(' · ')}</p>`).join('')}</details><div class="actions" style="margin-top:12px">${btn('Reuse as new',`reuseFormula('${f.id}')`,'small secondary')}${btn('Edit',`editFormula('${f.id}')`,'small outline')}${btn('Delete',`deleteFormula('${f.id}')`,'small danger')}</div></section>`).join(''):'<div class="empty">No matching formulas yet. Save your first mix to build client history.</div>'}function renderHistoryList(){let arr=db.formulas.filter(f=>f.client.toLowerCase().includes(historyQuery.toLowerCase())||f.service.toLowerCase().includes(historyQuery.toLowerCase()));document.getElementById('historylist').innerHTML=historyList(arr)}function reuseFormula(id){let f=db.formulas.find(x=>x.id===id);if(!f)return;current=clone(f);delete current.id;editId=null;go('mix')}function editFormula(id){let f=db.formulas.find(x=>x.id===id);if(!f)return;current=clone(f);editId=id;go('mix')}function deleteFormula(id){if(!confirm('Delete this saved formula? Export a backup first if needed.'))return;db.formulas=db.formulas.filter(f=>f.id!==id);save();render()}
function renderProducts(){return `<section class="panel"><h2>Product cost library</h2><p class="note">Purchase price ÷ package quantity = cost per unit. Keep weight ounces and fluid ounces separate.</p>${db.products.map(p=>`<div class="line"><div><b>${esc(p.name)}</b><div class="muted">${money(p.cost)} / ${num(p.size)} ${esc(p.unit)} · ${money(num(p.cost)/Math.max(.00001,num(p.size)))}/${esc(p.unit)}</div></div><div class="actions" style="flex:0 0 auto">${btn('Edit',`editProduct('${p.id}')`,'small outline')}${btn('✕',`deleteProduct('${p.id}')`,'small danger')}</div></div>`).join('')}</section><section class="panel"><h3 id="productTitle">Add a product</h3><input type="hidden" id="pid">${field('Product name','pname','')}<div class="grid2">${field('Package cost ($)','pcost','','number','min="0" step="any"')}${field('Package quantity','psize','','number','min="0.00001" step="any"')}</div><label class="field">Unit<select id="punit">${options(['weight oz','fl oz','g','mL','sheet','each'].map(v=>({value:v,label:v})),'weight oz')}</select></label>${btn('Save product','saveProduct()','full')}</section>`}function editProduct(id){let p=product(id);if(!p)return;document.getElementById('pid').value=p.id;document.getElementById('pname').value=p.name;document.getElementById('pcost').value=p.cost;document.getElementById('psize').value=p.size;document.getElementById('punit').value=p.unit;document.getElementById('productTitle').textContent='Edit product';window.scrollTo(0,document.body.scrollHeight)}function saveProduct(){let id=document.getElementById('pid').value;let name=document.getElementById('pname').value.trim(),cost=num(document.getElementById('pcost').value),size=num(document.getElementById('psize').value),unit=document.getElementById('punit').value;if(!name||!size){alert('Enter a product name and package quantity greater than zero.');return}let p={id:id||uid(),name,cost,size,unit};if(id)db.products=db.products.map(x=>x.id===id?p:x);else db.products.push(p);save();render()}function deleteProduct(id){if(db.formulas.some(f=>f.bowls.some(b=>b.items.some(i=>i.product===id)))||current.bowls.some(b=>b.items.some(i=>i.product===id))){alert('This product is used in a formula. Edit it instead of deleting.');return}if(confirm('Delete this product?')){db.products=db.products.filter(p=>p.id!==id);save();render()}}
function renderSettings(){let s=db.settings;return `<section class="panel"><h2>Business settings</h2>${field('Booth rent per week ($)','boothWeekly',s.boothWeekly,'number','min="0" step="any"')}${field('GlossGenius per month ($)','subscription',s.subscription,'number','min="0" step="any"')}${field('Other monthly overhead ($)','otherMonthly',s.otherMonthly,'number','min="0" step="any"')}${field('Booked hours per month','monthlyHours',s.monthlyHours,'number','min="1" step="any"')}${field('Processing fee (%)','processingPct',s.processingPct,'number','min="0" step="any"')}${field('Default other supplies ($)','supplyAllowance',s.supplyAllowance,'number','min="0" step="any"')}${field('Monthly earnings goal ($)','monthlyGoal',s.monthlyGoal,'number','min="0" step="any"')}${btn('Save settings','saveSettings()','full')}</section><section class="panel"><h2>Data & backups</h2><p class="note">Saved data lives only in this browser's local storage. Clearing site data, changing devices, or using a private browser can erase it. Export a backup frequently.</p><div class="actions">${btn('Export backup','exportBackup()')}${btn('Import backup',"document.getElementById('importfile').click()",'outline')}</div><input class="hidden" id="importfile" type="file" accept="application/json,.json" onchange="importBackup(this.files[0])"><p class="note">Import replaces the existing local library and formulas. Export before importing.</p></section><section class="panel"><h2>Service prices</h2>${db.services.map((s,i)=>`<div class="line"><span>${esc(s.name)}</span><span>${money(s.price)} · ${num(s.minutes)} min</span></div>`).join('')}<p class="note">Prices and durations can be adjusted for each formula on the Profit tab. Editable service templates can be added in a later version.</p></section><div class="warn">No cloud sync, user accounts, encryption, or automatic device backup in this prototype. Avoid storing sensitive client information.</div>`}function saveSettings(){Object.keys(db.settings).forEach(k=>db.settings[k]=num(document.getElementById(k).value));if(!db.settings.monthlyHours){alert('Booked hours must be greater than zero.');return}save();render()}function exportBackup(){let blob=new Blob([JSON.stringify({app:'The Beauty Ledger',version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='beauty-ledger-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importBackup(file){if(!file)return;try{let x=JSON.parse(await file.text());let d=x.data;if(!d||!Array.isArray(d.products)||!Array.isArray(d.formulas)||!d.settings)throw Error('Invalid backup');if(!confirm('Replace ALL local products, settings and formula history with this backup?'))return;db=d;save();render();alert('Backup imported.')}catch(e){alert('Could not import this file: '+e.message)}}
render();
</script></body></html>
